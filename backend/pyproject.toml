[project]
name = "olcwave"
version = "1.0.8"
description = "Web panel for OLCRtc"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "remnawave>=2.8.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "PyJWT>=2.9.0",
    "emoji>=2.15.0",
    "protobuf>=7.35.1",
    "fake-useragent>=2.2.0",
    "aiodocker>=0.27.0",
]

[tool.pytest.ini_options]
# Tests import app modules (config, rw, subscriptions, ...) directly, so the
# backend/src dir must be on sys.path.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
